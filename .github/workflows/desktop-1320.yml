name: Assemble desktop 1.3.20
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Download verified release inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir assembly
          gh release download desktop-v1.3.19 --pattern 'Yingce-1.3.19-win-x64.zip' --dir assembly
          gh release download desktop-v1.3.20 --pattern '*delta.zip' --pattern latest.json --pattern assemble-full.py --dir assembly
      - name: Assemble and verify every program file
        run: cd assembly && python assemble-full.py
      - name: Upload full archive and final manifest to draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload desktop-v1.3.20 assembly/Yingce-1.3.20-win-x64.zip assembly/latest.json --clobber
